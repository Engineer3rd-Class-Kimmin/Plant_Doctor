name: plant_doctor_flutter_rebuild
description: Flutter rebuild starter for Plant Doctor UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: 0.10.6
  camera_android: ^0.10.11
  http: ^1.2.2
  image: ^4.3.0
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  google_fonts: ^8.2.0
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/i18n/
